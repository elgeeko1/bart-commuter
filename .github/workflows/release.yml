name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Check tag matches script version
        run: |
          version=$(sed -n 's|^// Version: ||p' bart-commuter.js)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not match script version $version" >&2
            exit 1
          fi
      - run: python3 tools/build_manifest.py dist
      - run: cp bart-commuter.js bart-commuter-loader.js dist/
      - run: sha256sum bart-commuter.js bart-commuter-loader.js manifest.json > SHA256SUMS
        working-directory: dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # an environment whose protection rules gate every release
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-assets
          path: dist
      # published only once every asset is uploaded, since loaders read the latest release's manifest
      - name: Publish release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/bart-commuter.js dist/manifest.json dist/bart-commuter-loader.js dist/SHA256SUMS \
            --verify-tag --generate-notes --draft
          gh release edit "$GITHUB_REF_NAME" --draft=false
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
