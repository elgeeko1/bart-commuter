name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-python3.12-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: make deps
      - run: make lint

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # the loader tests build the release manifest and README copy with the Python tools
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: make deps
      - run: make coverage-js
      - uses: codecov/codecov-action@v7.1.1
        # a release reruns these jobs from its tag, without the upload token
        if: github.ref_type == 'branch'
        with:
          files: coverage/lcov.info
          flags: javascript
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - run: make deps
      - run: make coverage-py
      - uses: codecov/codecov-action@v7.1.1
        if: github.ref_type == 'branch'
        with:
          files: coverage/python.lcov
          flags: python
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
