# layout rules match the Prettier output
extends: default

ignore-from-file:
  - .gitignore
  - .prettierignore

rules:
  braces:
    min-spaces-inside: 1
    max-spaces-inside: 1
    min-spaces-inside-empty: 0
    max-spaces-inside-empty: 0
  comments:
    min-spaces-from-content: 1
  document-start: disable
  indentation:
    spaces: 2
    indent-sequences: true
  line-length:
    max: 120
  # GitHub Actions workflows name their trigger key "on"
  truthy:
    check-keys: false
